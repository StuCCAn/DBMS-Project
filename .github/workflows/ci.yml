name: CueClub CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "FINAL_DEPLOYMENT_CHECKLIST.md"
            "docs/CueClub_MidSem_Report.pdf"
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "::error::Missing required file: $file"; exit 1; }
          done

      - name: Reject merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!.git/**'; then
            echo "::error::Merge-conflict markers found."
            exit 1
          fi

      - name: Reject tracked secrets and temporary report copies
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$|dbms \(2\)\.pdf$'; then
            echo "::error::A secret-like file or temporary report copy is tracked."
            exit 1
          fi

      - name: Require canonical database directory name
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^Database/'; then
            echo "::error::Use the lowercase database/ directory."
            exit 1
          fi

  report-integrity:
    name: Verify immutable mid-semester report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify report checksum
        shell: bash
        run: |
          set -euo pipefail
          expected="7ab7f233a849b4019fc994b85c6c5eda5c3f08a38f7f29339825ce8f204c6b2e"
          actual="$(sha256sum docs/CueClub_MidSem_Report.pdf | cut -d' ' -f1)"
          test "$actual" = "$expected" || {
            echo "::error::The immutable mid-semester report was modified."
            exit 1
          }

      - name: Verify report is unchanged in this change
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BASE_SHA" HEAD -- docs/CueClub_MidSem_Report.pdf; then
            echo "::error::Pull requests must not modify the mid-semester report."
            exit 1
          fi

  database:
    name: MySQL database validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cueclub-ci
          MYSQL_DATABASE: cueclub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcueclub-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect database scripts
        id: detect-database
        shell: bash
        run: |
          if compgen -G "database/*.sql" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No database scripts found; database validation will run after database/ is added."
          fi

      - name: Check database script set
        if: steps.detect-database.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "database/schema.sql"
            "database/triggers.sql"
            "database/procedures.sql"
            "database/views.sql"
            "database/seed.sql"
            "database/demo.sql"
            "database/constraint_tests.sql"
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "::error::Missing database file: $file"; exit 1; }
          done

      - name: Install MySQL client
        if: steps.detect-database.outputs.available == 'true'
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Load schema, routines, views, and seed data
        if: steps.detect-database.outputs.available == 'true'
        shell: bash
        env:
          MYSQL_PWD: cueclub-ci
        run: |
          set -euo pipefail
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root < database/schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root cueclub < database/triggers.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root cueclub < database/procedures.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root cueclub < database/views.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root cueclub < database/seed.sql

      - name: Run demonstration workflow
        if: steps.detect-database.outputs.available == 'true'
        shell: bash
        env:
          MYSQL_PWD: cueclub-ci
        run: mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root cueclub < database/demo.sql

      - name: Run database constraint tests
        if: steps.detect-database.outputs.available == 'true'
        shell: bash
        env:
          MYSQL_PWD: cueclub-ci
        run: mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root cueclub < database/constraint_tests.sql
